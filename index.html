<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proton Meet Chat Cleaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: header strip, two panes (raw in → clean out) that stack on phones, options row between header and panes */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --fg: #1d2421;
  --muted: #5e6a64;
  --line: #d7ddd9;
  --accent: #1f7a5c;
  --accent-fg: #ffffff;
  --strike: #b4433a;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --surface: #1c2320; --fg: #e4ebe7; --muted: #95a39c;
    --line: #2f3a35; --accent: #4cc79a; --accent-fg: #0d1512; --strike: #e7806f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2320; --fg: #e4ebe7; --muted: #95a39c;
  --line: #2f3a35; --accent: #4cc79a; --accent-fg: #0d1512; --strike: #e7806f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  margin: 0; padding: 24px 16px 40px;
}
.wrap { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
header h1 { margin: 0; font-size: 1.5rem; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }
.options {
  display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.options label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.options input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 5px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg-label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
.pane { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-width: 0; }
.pane-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pane-head h2 { margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
textarea {
  width: 100%; min-height: 460px; resize: vertical;
  font-family: var(--font-mono); font-size: 13px; line-height: 1.55;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px;
}
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.stats { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); }
.example-note { font-size: 0.85rem; color: var(--strike); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Proton Meet Chat Cleaner</h1>
    <p>Select all in the Proton Meet chat panel, copy, and paste on the left. The clean log appears on the right with buttons, avatar initials, and join/leave notices removed.</p>
  </header>

  <div class="options" role="group" aria-label="Options">
    <label><input type="checkbox" id="optJoins" checked> Remove joined / left notices</label>
    <label><input type="checkbox" id="optTimes" checked> Keep timestamps</label>
    <label><input type="checkbox" id="optNames" checked> Keep names</label>
    <label><input type="checkbox" id="optMerge"> Merge back-to-back messages from the same person</label>
    <span style="display:inline-flex;gap:8px;align-items:center">
      <span class="seg-label">Output</span>
      <span class="seg" role="group" aria-label="Output format">
        <button type="button" id="fmtText" aria-pressed="true">Plain text</button>
        <button type="button" id="fmtMd" aria-pressed="false">Markdown</button>
      </span>
    </span>
  </div>

  <div class="panes">
    <section class="pane">
      <div class="pane-head">
        <h2>Raw chat (paste here)</h2>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="example-note" id="exampleNote">Example from Oct 2026 chat</span>
          <button class="btn" id="clearBtn" type="button">Clear</button>
        </span>
      </div>
      <textarea id="raw" spellcheck="false" aria-label="Raw chat"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">
        <h2>Clean log</h2>
        <span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <span class="stats" id="stats"></span>
          <button class="btn primary" id="copyBtn" type="button">Copy</button>
        </span>
      </div>
      <textarea id="out" spellcheck="false" readonly aria-label="Clean log"></textarea>
    </section>
  </div>
</div>

<script>
const TIME_RE = /^\s*\d{1,2}:\d{2}(\s*[AP]M)?\s*$/i;
const INITIALS_RE = /^\s*[\p{L}\p{N}]{1,3}\s*$/u;
const TIMER_RE = /^\s*\d{1,2}:\d{2}:\d{2}\s*$/;
const EVENT_RE = /^(Joined|Left) .+$/;

function parse(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  // A message header is: initials line, name line, time line.
  const heads = [];
  for (let i = 2; i < lines.length; i++) {
    if (TIME_RE.test(lines[i]) && INITIALS_RE.test(lines[i - 2]) && lines[i - 1].trim()) heads.push(i);
  }
  // Cut the meeting footer (meeting title, call timer, Leave button, toast) and keep the title.
  let footer = lines.length, title = '';
  const last = heads[heads.length - 1] ?? lines.length;
  for (let j = lines.length - 1; j > last; j--) {
    if (TIMER_RE.test(lines[j])) {
      footer = j - 1;
      while (footer > last && !lines[footer].trim()) footer--;
      title = lines[footer].trim();
      break;
    }
  }
  // With a known title only "Joined <title>" / "Left <title>" count, so a message like "Left early" survives.
  const isEventLine = l => title ? l === `Joined ${title}` || l === `Left ${title}` : EVENT_RE.test(l);
  const msgs = [];
  heads.forEach((h, k) => {
    const end = k + 1 < heads.length ? heads[k + 1] - 2 : footer;
    let body = lines.slice(h + 1, end).map(l => l.replace(/\s+$/, ''));
    while (body.length && !body[0].trim()) body.shift();
    while (body.length && !body[body.length - 1].trim()) body.pop();
    // collapse runs of blank lines to one
    body = body.filter((l, i, a) => l.trim() || (i > 0 && a[i - 1].trim()));
    const name = lines[h - 1].trim().replace(/\s*\(You\)\s*$/, '');
    const isEvent = body.length === 1 && isEventLine(body[0].trim());
    msgs.push({ name, time: lines[h].trim(), body, isEvent });
  });
  return msgs;
}

const $ = id => document.getElementById(id);
let fmt = 'text';

function render() {
  const msgs = parse($('raw').value);
  const dropEvents = $('optJoins').checked, showTime = $('optTimes').checked,
        showName = $('optNames').checked, merge = $('optMerge').checked;
  const kept = msgs.filter(m => !(dropEvents && m.isEvent));
  const groups = [];
  for (const m of kept) {
    const last = groups[groups.length - 1];
    if (merge && last && last.name === m.name) last.body.push('', ...m.body);
    else groups.push({ ...m, body: [...m.body] });
  }
  const md = fmt === 'md';
  const out = groups.map(g => {
    let head = '';
    if (md) {
      const parts = [];
      if (showName) parts.push(`**${g.name}**`);
      if (showTime) parts.push(g.time);
      head = parts.join(' · ');
    } else {
      if (showName && showTime) head = `${g.name} (${g.time}):`;
      else if (showName) head = `${g.name}:`;
      else if (showTime) head = `${g.time}:`;
    }
    const body = md ? g.body.map((l, i, a) => (l && a[i + 1] ? l + '  ' : l)) : g.body;
    if (md && head) head += '  ';
    return (head ? [head, ...body] : body).join('\n');
  }).join('\n\n');
  $('out').value = out;
  const removed = msgs.length - kept.length;
  $('stats').innerHTML = msgs.length
    ? `<b>${groups.length}</b> messages kept · <b>${removed}</b> join/leave removed`
    : 'No messages found yet';
}

function saveOpts() {
  try {
    localStorage.setItem('pmcc-opts', JSON.stringify({
      j: $('optJoins').checked, t: $('optTimes').checked, n: $('optNames').checked, m: $('optMerge').checked, f: fmt
    }));
  } catch (e) {}
}
function loadOpts() {
  try {
    const o = JSON.parse(localStorage.getItem('pmcc-opts') || 'null');
    if (!o) return;
    $('optJoins').checked = o.j; $('optTimes').checked = o.t; $('optNames').checked = o.n; $('optMerge').checked = o.m;
    setFmt(o.f || 'text', false);
  } catch (e) {}
}
function setFmt(f, save = true) {
  fmt = f;
  $('fmtText').setAttribute('aria-pressed', f === 'text');
  $('fmtMd').setAttribute('aria-pressed', f === 'md');
  render(); if (save) saveOpts();
}

$('fmtText').onclick = () => setFmt('text');
$('fmtMd').onclick = () => setFmt('md');
['optJoins', 'optTimes', 'optNames', 'optMerge'].forEach(id => $(id).addEventListener('change', () => { render(); saveOpts(); }));
$('raw').addEventListener('input', () => { $('exampleNote').hidden = true; render(); });
$('clearBtn').onclick = () => { $('raw').value = ''; $('exampleNote').hidden = true; render(); $('raw').focus(); };
$('copyBtn').onclick = () => {
  const btn = $('copyBtn'), text = $('out').value;
  const done = msg => { btn.textContent = msg; setTimeout(() => (btn.textContent = 'Copy'), 1500); };
  navigator.clipboard.writeText(text).then(() => done('Copied'), () => {
    $('out').focus(); $('out').select(); done('Press Ctrl+C');
  });
};

loadOpts();
render();
</script>

</body>
</html>
